version: "3.9"

networks:
  localstack:
    driver: bridge

services:
  localstack:
    image: gresau/localstack-persist:4.14.0   # was localstack/localstack:3.0
    container_name: localstack
    restart: unless-stopped
    networks:
      - localstack
    ports:
      - "192.168.0.158:4566:4566"
    environment:
      - SERVICES=secretsmanager
      - PERSIST_DEFAULT=1        # was PERSISTENCE=1 (that var is ignored by this image)
      - DEBUG=0
      - LOCALSTACK_HOST=localstack.teleport.homebytes.space
      - EXTRA_CORS_ALLOWED_ORIGINS=https://localstack.teleport.homebytes.space
    volumes:
      - ./data:/persisted-data   # was /var/lib/localstack — different mount path for this image