version: "3.9"

networks:
  localstack:
    driver: bridge

services:
  localstack:
    # Pinned, not :latest — newer LocalStack releases (confirmed with 2026.6.2)
    # refuse to start at all without a paid LOCALSTACK_AUTH_TOKEN, even for
    # community-tier services like Secrets Manager. 3.0 is free/unauthenticated.
    image: localstack/localstack:3.0
    container_name: localstack
    restart: unless-stopped
    networks:
      - localstack
    ports:
      - "4566:4566"   # Edge port - all enabled AWS service APIs, incl. Secrets Manager
    environment:
      - SERVICES=secretsmanager
      - PERSISTENCE=1
      - DEBUG=0
    volumes:
      - ./data:/var/lib/localstack
