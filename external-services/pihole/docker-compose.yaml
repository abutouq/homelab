# More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    dns:
#      - 127.0.0.1
      - 8.8.8.8 # Google
      - 8.8.4.4
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port — loopback only; reach it via the Teleport app
      # (pihole.teleport.homebytes.space), not directly on the LAN
      - "127.0.0.1:80:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
#      - "443:443/tcp"
      # Uncomment the below if using Pi-hole as your DHCP Server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    environment:
      PIHOLE_DNS_: '8.8.8.8;8.8.4.4'
      # Set the appropriate timezone for your location from
      # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones, e.g:
      TZ: 'Asia/Amman'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: ‘pinhole’
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
      FTLCONF_dns_listeningMode: 'ALL'
    # Volumes store your data between container upgrades
      FTLCONF_ntp_sync_active: "false"
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - './etc-pihole:/etc/pihole'
      # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards. Needs environment variable FTLCONF_misc_etc_dnsmasq_d: 'true'
      #- './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    restart: unless-stopped

  pihole-exporter:
    container_name: pihole-exporter
    image: ekofr/pihole-exporter:latest
    ports:
      - "9617:9617" # Default port for Prometheus to scrape
    environment:
      - PIHOLE_PROTOCOL=http
      - PIHOLE_HOSTNAME=pihole  # Matches the container_name above
      - PIHOLE_PASSWORD=‘pinhole’ # Matches FTLCONF_webserver_api_password
      - INTERVAL=30s            # How often to scrape the Pi-hole API
    restart: unless-stopped
    depends_on:
      - pihole


  netalertx:
    container_name: netalertx
    image: ghcr.io/netalertx/netalertx:latest
    restart: unless-stopped
    volumes:
      # NetAlertX now expects a single consolidated /data mount
      - ./netalertx:/data
    environment:
      - TZ=Asia/Amman
      - PORT=20211
      # 127.0.0.1, not the LAN IP — pihole's port 80 is now loopback-only,
      # and netalertx shares the host's network namespace so this still works
      - PIHOLE_URL=http://127.0.0.1/admin/api.php
      - PIHOLE_TOKEN=‘pinhole’
    network_mode: "host" 
    cap_add:
      - NET_RAW           # Required for packet crafting/ping
      - NET_ADMIN         # Required for network interface management
      - NET_BIND_SERVICE  # Required for legacy discovery (nbtscan)
    depends_on:
      - pihole
