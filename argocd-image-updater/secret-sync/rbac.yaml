apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-image-updater-secret-sync
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-image-updater-secret-sync
  namespace: argocd
rules:
  # Scoped to exactly the two secrets and one deployment this job touches -
  # not a blanket grant on all secrets in the argocd namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-image-updater-secret", "homelab-repo-creds"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["argocd-image-updater-controller"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-image-updater-secret-sync
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-image-updater-secret-sync
subjects:
  - kind: ServiceAccount
    name: argocd-image-updater-secret-sync
    namespace: argocd
