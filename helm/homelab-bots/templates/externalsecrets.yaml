# Image pull secret for registry.gitlab.com.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.registry.secretName }}
  labels:
    {{- include "homelab-bots.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ .Values.externalSecrets.registry.secretName }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ "{{ .dockerconfigjson }}" | quote }}
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.externalSecrets.registry.vaultKey }}
        property: dockerconfigjson
{{- if .Values.infraBrief.enabled }}
---
# Telegram settings plus the Claude token, as env vars for the infra brief jobs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-brief
  labels:
    {{- include "homelab-bots.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: infra-brief
  dataFrom:
    - extract:
        key: {{ .Values.infraBrief.vaultKey }}
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: {{ .Values.infraBrief.claudeToken.vaultKey }}
        property: {{ .Values.infraBrief.claudeToken.property }}
{{- end }}
{{- if .Values.sreBot.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sre-bot
  labels:
    {{- include "homelab-bots.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: sre-bot
  dataFrom:
    - extract:
        key: {{ .Values.sreBot.vaultKey }}
{{- end }}
