{{- if .Values.careerOps.enabled }}
{{- $c := .Values.careerOps }}
# career-ops (https://career-ops.org), once a day:
#   1. scan     `node scan.mjs` reads public job boards, keeps remote roles whose
#               titles match, appends them to data/pipeline.md (no tokens)
#   2. match    batch runner in match mode: `claude -p` scores each new posting
#               against cv.md (1-5) into reports/ and the tracker
#   3. notify   matches at or above minScore go to Telegram
#   4. prepare  the best recent matches (prepare.minScore) get a tailored CV
#               and cover letter, as PDFs on the volume and in Telegram.
#               Nothing is submitted: applying stays manual.
#
# Config comes from values only: each run rebuilds portals.yml (upstream's
# template + careerOps.portals deep-merged on top) and config/profile.yml.
# JSON is valid YAML, so those files are written as JSON. cv.md comes from
# Vault (secret/apps/career-ops, field cv_md): this repo is public.
apiVersion: v1
kind: ConfigMap
metadata:
  name: career-ops-config
  labels:
    {{- include "homelab-bots.labels" . | nindent 4 }}
data:
  portals-overrides.json: {{ $c.portals | toJson | quote }}
  extra-companies.json: {{ $c.extraCompanies | default list | toJson | quote }}
  extra-title-negative.json: {{ $c.extraTitleNegative | default list | toJson | quote }}
  {{- with $c.match.seniority }}
  # Appended to upstream's batch-prompt-match.md, which scores skills only:
  # a senior CV covers a junior JD, so junior/mid roles scored high.
  seniority.md: |

    ## Seniority gate (deployment override)

    This one check deliberately uses the candidate's target, overriding "score the CV against the JD only". The candidate has {{ $c.profile.candidate.years_of_experience }} years of experience and wants Senior, Staff, Lead, Principal or Head roles.

    From the JD's title and text, work out the level it hires for and the most years of experience it requires. The role is below target when either:
    - the title marks it junior or mid-level (Junior, Jr, Mid, Mid-Level, Associate, Entry, Graduate, Trainee, Intern, or level I or II without Senior/Staff/Lead/Principal), or
    - the highest required experience is under {{ .minYears }} years and nothing in the title or text says senior, staff, lead or principal.

    If it is below target, cap the Match Score at {{ .cap }} however well the skills match, and say so in the summary. A JD that states neither a level nor years is not capped.

    In the report, add this line right under the `**Score:**` line:
    `**Seniority:** <level the JD hires for> (<required years, or "years not stated">)<", capped" when the cap applied>`
  {{- end }}
  profile.json: {{ $c.profile | toJson | quote }}
  render-config.mjs: |
    // Objects merge key by key; arrays and scalars from the override replace.
    // extraCompanies are appended to upstream's tracked_companies (same name wins).
    import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';
    import { loadYaml } from '/app/lib/yaml-document.mjs';
    const [base, overrides, profile, data, extra, negExtra] = process.argv.slice(2);
    const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);
    const merge = (a, b) => {
      if (!isObj(a) || !isObj(b)) return b;
      const out = { ...a };
      for (const [k, v] of Object.entries(b)) out[k] = merge(a[k], v);
      return out;
    };
    const portals = merge(loadYaml(readFileSync(base, 'utf-8')) || {}, JSON.parse(readFileSync(overrides, 'utf-8')));
    const added = extra ? JSON.parse(readFileSync(extra, 'utf-8')) : [];
    // extraTitleNegative is appended to upstream's title_filter.negative.
    const neg = negExtra ? JSON.parse(readFileSync(negExtra, 'utf-8')) : [];
    portals.title_filter = { ...portals.title_filter, negative: [...new Set([...(portals.title_filter?.negative || []), ...neg])] };
    const names = new Set(added.map((c) => c.name));
    portals.tracked_companies = [...(portals.tracked_companies || []).filter((c) => !names.has(c.name)), ...added];
    writeFileSync(`${data}/portals.yml`, JSON.stringify(portals, null, 2) + '\n');
    mkdirSync(`${data}/config`, { recursive: true });
    writeFileSync(`${data}/config/profile.yml`, JSON.stringify(JSON.parse(readFileSync(profile, 'utf-8')), null, 2) + '\n');
  notify.mjs: |
    // Sends this run's matches (completed in batch-state.tsv now, not before,
    // score >= MIN_SCORE) to Telegram, best first. Silent when there are none.
    import { readFileSync, readdirSync, existsSync } from 'node:fs';
    import { sendMessage } from '/config/tg.mjs';
    const [stateBefore, stateAfter, reportsDir] = process.argv.slice(2);
    const minScore = Number(process.env.MIN_SCORE);
    const rows = (f) => existsSync(f)
      ? readFileSync(f, 'utf-8').split('\n').slice(1).filter(Boolean).map((l) => l.split('\t'))
      : [];
    const done = new Set(rows(stateBefore).filter((r) => r[2] === 'completed').map((r) => r[0]));
    const fresh = rows(stateAfter).filter((r) => r[2] === 'completed' && !done.has(r[0]));
    const title = (num) => {
      const f = existsSync(reportsDir) && readdirSync(reportsDir).find((n) => n.startsWith(`${num}-`));
      const h = f && readFileSync(`${reportsDir}/${f}`, 'utf-8').match(/^#\s+(.+)$/m);
      return h ? h[1].trim() : '';
    };
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const hits = fresh
      .map(([, url, , , , num, score]) => ({ url, num, score: Number(score), title: title(num) }))
      .filter((h) => h.score >= minScore)
      .sort((a, b) => b.score - a.score);
    console.log(`${fresh.length} evaluated this run, ${hits.length} at or above ${minScore}`);
    if (!hits.length) process.exit(0);
    const lines = hits.slice(0, 20).map((h) =>
      `<b>${h.score.toFixed(1)}</b> ${esc(h.title || h.url)}\n${esc(h.url)}\n<i>report ${esc(h.num)}</i>`);
    const text = `💼 <b>career-ops: ${hits.length} match${hits.length > 1 ? 'es' : ''}</b> (of ${fresh.length} scored)\n\n${lines.join('\n\n')}`;
    try {
      await sendMessage(text);
    } catch (e) {
      console.error(e.message);
      process.exit(1);
    }
  tg.mjs: |
    // Telegram Bot API calls, shared by notify.mjs and prepare.mjs. Network
    // errors (e.g. ECONNRESET) and 429/5xx are retried; other 4xx throw at once.
    import { readFileSync } from 'node:fs';
    import { basename } from 'node:path';
    class Fatal extends Error {}
    async function call(method, body) {
      const form = body instanceof FormData;
      for (let attempt = 1; ; attempt++) {
        let err;
        try {
          const res = await fetch(`${process.env.TELEGRAM_API_BASE || 'https://api.telegram.org'}/bot${process.env.TELEGRAM_BOT_TOKEN}/${method}`, {
            method: 'POST',
            headers: form ? undefined : { 'content-type': 'application/json' },
            body: form ? body : JSON.stringify(body),
            signal: AbortSignal.timeout(60000),
          });
          if (res.ok) return;
          err = `${res.status} ${await res.text()}`;
          if (res.status < 500 && res.status !== 429) throw new Fatal(`telegram ${method}: ${err}`);
        } catch (e) {
          if (e instanceof Fatal) throw e;
          err = `${e.message}${e.cause ? ` (${e.cause.code || e.cause.message})` : ''}`;
        }
        if (attempt === 5) throw new Error(`telegram ${method}: giving up after ${attempt} attempts: ${err}`);
        console.error(`telegram ${method} attempt ${attempt} failed: ${err}; retrying`);
        await new Promise((r) => setTimeout(r, attempt * 10000));
      }
    }
    export const sendMessage = (text) => call('sendMessage', {
      chat_id: process.env.TELEGRAM_CHAT_ID, text: text.slice(0, 4096), parse_mode: 'HTML', disable_web_page_preview: true,
    });
    export const sendDocument = (path, name = basename(path)) => {
      const fd = new FormData();
      fd.set('chat_id', process.env.TELEGRAM_CHAT_ID);
      fd.set('document', new Blob([readFileSync(path)], { type: 'application/pdf' }), name);
      return call('sendDocument', fd);
    };
  prepare.mjs: |
    // Application bundles for the best recent matches. For each one, a single
    // `claude -p` session tailors the CV (upstream modes/pdf.md, fact gate
    // included) and writes a cover letter, both rendered to PDF under
    // output/apply/<report>/. The bundle then goes to Telegram. Nothing is
    // submitted anywhere: applying stays manual.
    //
    // output/apply/prepared.tsv is the ledger (report, status, attempts, time):
    // a prepared report is never redone, a failed one is retried once.
    import { readFileSync, readdirSync, existsSync, mkdirSync, rmSync, appendFileSync } from 'node:fs';
    import { spawnSync } from 'node:child_process';
    import { sendMessage, sendDocument } from '/config/tg.mjs';
    const [stateFile, D] = process.argv.slice(2);
    const minScore = Number(process.env.PREP_MIN_SCORE);
    const max = Number(process.env.PREP_MAX);
    const maxAgeMs = Number(process.env.PREP_MAX_AGE_DAYS) * 86400000;
    const timeoutMs = Number(process.env.PREP_TIMEOUT_MINUTES) * 60000;
    const maxAttempts = 2;

    const root = `${D}/output/apply`;
    const ledgerFile = `${root}/prepared.tsv`;
    mkdirSync(root, { recursive: true });
    const ledger = new Map(); // report -> { status, attempts }; the last row wins
    if (existsSync(ledgerFile)) {
      for (const l of readFileSync(ledgerFile, 'utf-8').split('\n').filter(Boolean)) {
        const [num, status, attempts] = l.split('\t');
        ledger.set(num, { status, attempts: Number(attempts) || 0 });
      }
    }
    const record = (num, status, attempts) =>
      appendFileSync(ledgerFile, `${num}\t${status}\t${attempts}\t${new Date().toISOString()}\n`);

    const reports = existsSync(`${D}/reports`) ? readdirSync(`${D}/reports`) : [];
    const rows = existsSync(stateFile)
      ? readFileSync(stateFile, 'utf-8').split('\n').slice(1).filter(Boolean).map((l) => l.split('\t'))
      : [];
    const queue = rows
      .map(([, url, status, , completedAt, num, score]) => ({ url, status, completedAt, num, score: Number(score) }))
      .filter((r) => r.status === 'completed' && /^\d+$/.test(r.num) && r.score >= minScore)
      .filter((r) => Date.now() - Date.parse(r.completedAt) <= maxAgeMs)
      .filter((r) => {
        const l = ledger.get(r.num);
        return !l || (l.status === 'failed' && l.attempts < maxAttempts);
      })
      .map((r) => ({ ...r, report: reports.find((n) => n.startsWith(`${r.num}-`) && n.endsWith('.md')) }))
      .filter((r) => r.report)
      .sort((a, b) => b.score - a.score)
      .slice(0, max);
    console.log(`${queue.length} bundle(s) to prepare (score >= ${minScore}, at most ${max})`);

    // Workers read untrusted job text with permissions skipped: they get no
    // Telegram credentials, so they cannot message anyone.
    const env = { ...process.env };
    for (const k of ['TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID', 'TELEGRAM_API_BASE']) delete env[k];
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    for (const job of queue) {
      const reportPath = `${D}/reports/${job.report}`;
      // <num>-<company-slug>-<YYYY-MM-DD>.md
      const slug = job.report.replace(/\.md$/, '').replace(/^\d+-/, '').replace(/-\d{4}-\d{2}-\d{2}$/, '');
      const heading = (readFileSync(reportPath, 'utf-8').match(/^#\s+(.+)$/m)?.[1] || slug).replace(/^Evaluation:\s*/, '').trim();
      const out = `${root}/${job.num}`;
      rmSync(out, { recursive: true, force: true });
      mkdirSync(out, { recursive: true });
      const attempts = (ledger.get(job.num)?.attempts || 0) + 1;
      console.log(`\n== bundle ${job.num} (${job.score}) ${heading}, attempt ${attempts}`);

      const prompt = `Unattended run (modes/_shared.md, "Unattended runs"): nobody can answer. Never ask, never wait, and never submit, send or post anything to any site.

    Prepare an application bundle for one posting:
    - URL: ${job.url}
    - Report number: ${job.num}
    - Evaluation report: ${reportPath} (its "Job Description (archived verbatim)" section is the JD; fetch the URL only if that section is missing)
    - Output folder: output/apply/${job.num}/ (absolute: ${out})

    Identity: config/profile.yml deliberately holds no name or contact details. Wherever a step reads the candidate's name, email, phone, location, LinkedIn or GitHub from the profile, take them from the header of cv.md instead.

    1. Tailored CV. Follow modes/pdf.md (in your system prompt) with these unattended defaults:
       - Wherever it says to tell or ask the user (skill gaps, title mismatches, unmatched entries, missing keywords), do not stop: keep cv.md's job titles, never claim a gap skill, and write the item to output/apply/${job.num}/notes.md.
       - Skip the optional parts: application bundle init, JD similarity and reuse, the hiring-manager audit and the ATS variant.
       - Write the HTML to output/apply/${job.num}/cv.html and render it with generate-pdf.mjs to output/apply/${job.num}/cv.pdf, passing --report=${job.num}.
       - The fact gate (verify-cv-facts.mjs) is hard. If it fails, remove the unsupported claim and rebuild. Never edit cv.md, article-digest.md or config/cv-facts.json.
    2. Cover letter. Write it yourself from cv.md and the report only (no web research), in English, 250-350 words, direct and specific to this JD. Do not run modes/cover.md's interactive steps; read only its "Step 9" for the payload shape and the fact-validator rules. Use: an opening tied to the role and company, profile_intro, 2-3 achievements taken from cv.md (no new numbers), problems_section (what you would tackle first, from the JD), closing. No greeting unless the JD names the hiring manager, language_closing null, user_inputs []. Write the payload to /tmp/cover-${job.num}.json with output_path "output/apply/${job.num}/cover-letter.pdf" and run node generate-cover-letter.mjs --payload /tmp/cover-${job.num}.json. If the validator blocks, remove the claim and rerun. Also save the letter as plain text to output/apply/${job.num}/cover-letter.txt for pasting into forms.
    3. Notes. Add to output/apply/${job.num}/notes.md, plain text, short bullets: skill gaps, keyword coverage %, every warning from the checks, and likely knock-out questions (work authorization or location for the hiring country, required years, degree, salary) with what the CV says about each.

    Do not change data/applications.md, the tracker, cv.md or any other report. End with exactly one line: "bundle: ok" or "bundle: failed <reason>".`;

      const res = spawnSync('claude', ['-p', '--dangerously-skip-permissions', '--append-system-prompt-file', 'modes/pdf.md', prompt],
        { stdio: 'inherit', env, timeout: timeoutMs, killSignal: 'SIGKILL' });
      if (res.error) console.error(`claude: ${res.error.message}`);
      const cv = `${out}/cv.pdf`;
      const cover = `${out}/cover-letter.pdf`;
      if (!existsSync(cv)) {
        console.error(`bundle ${job.num}: no CV PDF, marked failed`);
        record(job.num, 'failed', attempts);
        continue;
      }
      record(job.num, 'prepared', attempts);

      const notes = existsSync(`${out}/notes.md`) ? readFileSync(`${out}/notes.md`, 'utf-8').trim() : '';
      const text = `📝 <b>Application ready</b>: <b>${job.score.toFixed(1)}</b> ${esc(heading)}\n${esc(job.url)}\n<i>report ${job.num}, files in output/apply/${job.num}/</i>`
        + (existsSync(cover) ? '' : '\n⚠️ no cover letter this time')
        + (notes ? `\n\n${esc(notes.slice(0, 3200))}` : '');
      try {
        await sendMessage(text);
        await sendDocument(cv, `cv-${slug}.pdf`);
        if (existsSync(cover)) await sendDocument(cover, `cover-letter-${slug}.pdf`);
      } catch (e) {
        console.error(`bundle ${job.num}: ${e.message}`);
        process.exitCode = 1;
      }
    }
  run.sh: |
    set -euo pipefail
    D="$CAREER_OPS_DATA_DIR"
    npm install --omit=dev --no-audit --no-fund --loglevel=error
    npm install -g --prefix /tmp/claude --no-audit --no-fund --loglevel=error "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
    export PATH="/tmp/claude/bin:$PATH"

    node /config/render-config.mjs templates/portals.example.yml \
      /config/portals-overrides.json /config/profile.json "$D" /config/extra-companies.json /config/extra-title-negative.json
    cp /secrets/cv.md "$D/cv.md"

    echo "== scan"
    # Exit 2 means every board failed; still score what is already queued.
    node scan.mjs $SCAN_ARGS || echo "scan exited $?, continuing with the existing inbox"
    if [ -n "$FULL_SCAN_ATS" ]; then
      echo "== full scan ($FULL_SCAN_ATS)"
      # Every company on these ATSs, not just tracked ones; same filters.
      # Workable's feed is cached in data/cache (~350 MB) and re-downloaded
      # only when it changes.
      node scan-ats-full.mjs --ats "$FULL_SCAN_ATS" --since "$FULL_SCAN_SINCE" \
        || echo "full scan exited $?, continuing"
    fi

    echo "== match"
    # The runner keeps its queue and state beside the script, which is an
    # emptyDir here: restore from the volume and save back on any exit.
    mkdir -p "$D/batch"
    for f in batch-input.tsv batch-state.tsv; do
      if [ -f "$D/batch/$f" ]; then cp "$D/batch/$f" batch/; fi
    done
    save() { for f in batch-input.tsv batch-state.tsv; do if [ -f "batch/$f" ]; then cp "batch/$f" "$D/batch/"; fi; done; }
    trap save EXIT
    # Normalize the runner's state before it starts: header first (the runner
    # writes one only when the file is missing, and an empty file without one
    # makes its rewrites pile up blank "0" rows), one row per offer, and no
    # rows left "processing" by a run that was cut short (concurrencyPolicy
    # Forbid: nothing is running now), so those offers are retried.
    if [ -s batch/batch-state.tsv ]; then
      printf 'id\turl\tstatus\tstarted_at\tcompleted_at\treport_num\tscore\terror\tretries\n' > /tmp/state.clean
      awk -F'\t' '$1 ~ /^[1-9][0-9]*$/ && $2 != "" && $3 != "processing" {
          if (!($1 in row)) order[++n] = $1; row[$1] = $0 }
        END { for (i = 1; i <= n; i++) print row[order[i]] }' batch/batch-state.tsv >> /tmp/state.clean
      echo "state: $(($(wc -l < batch/batch-state.tsv))) lines -> $(($(wc -l < /tmp/state.clean) - 1)) offers"
      cp /tmp/state.clean batch/batch-state.tsv
    else
      rm -f batch/batch-state.tsv
    fi
    cp batch/batch-state.tsv /tmp/state.before 2>/dev/null || : > /tmp/state.before
    node sync-batch-input.mjs
    if [ -f /config/seniority.md ]; then cat /config/seniority.md >> batch/batch-prompt-match.md; fi
    ./batch/batch-runner.sh --mode match --limit "$MAX_EVALUATIONS" --parallel "$PARALLEL" || echo "batch runner exited $?"
    save

    echo "== notify"
    node /config/notify.mjs /tmp/state.before batch/batch-state.tsv "$D/reports"

    if [ "$PREP_MAX" -gt 0 ]; then
      echo "== prepare"
      node /config/prepare.mjs batch/batch-state.tsv "$D"
    fi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: career-ops
  labels:
    {{- include "homelab-bots.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: career-ops
  data:
    - secretKey: cv.md
      remoteRef:
        key: {{ $c.vaultKey }}
        property: cv_md
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: {{ $c.telegram.vaultKey }}
        property: TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: {{ $c.telegram.vaultKey }}
        property: TELEGRAM_CHAT_ID
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: {{ $c.claudeToken.vaultKey }}
        property: {{ $c.claudeToken.property }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: career-ops-nas
  labels:
    {{- include "homelab-bots.labels" . | nindent 4 }}
  annotations:
    # Tracker, reports, batch state and scan-history (the dedup source).
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $c.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: career-ops
  labels:
    {{- include "homelab-bots.labels" . | nindent 4 }}
    app.kubernetes.io/name: career-ops
spec:
  schedule: {{ $c.schedule | quote }}
  timeZone: {{ .Values.timeZone }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Scan and batch state are resumable; the next scheduled run is the retry.
      backoffLimit: 0
      # Scan + up to match.maxPerRun evaluations + prepare.maxPerRun bundles.
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: career-ops
          annotations:
            # Values changes show up as a pod template diff in ArgoCD.
            checksum/config: {{ toJson (list $c.portals $c.profile $c.extraCompanies $c.extraTitleNegative $c.match $c.prepare) | sha256sum }}
        spec:
          restartPolicy: Never
          # Workers run claude with permissions skipped on untrusted job text:
          # give the pod nothing in the cluster to reach.
          automountServiceAccountToken: false
          initContainers:
            # Code is fetched fresh at a pinned commit; personal data stays on the volume.
            - name: fetch
              image: {{ $c.gitImage }}
              securityContext:
                readOnlyRootFilesystem: true
              command: ["/bin/sh", "-euc"]
              args:
                - |
                  cd /app
                  git init -q .
                  git remote add origin {{ $c.repo }}
                  git fetch -q --depth 1 origin {{ $c.ref }}
                  git checkout -q FETCH_HEAD
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
              volumeMounts:
                - name: app
                  mountPath: /app
          containers:
            - name: career-ops
              image: {{ $c.image }}
              imagePullPolicy: IfNotPresent
              workingDir: /app
              command: ["/bin/bash", "/config/run.sh"]
              securityContext:
                readOnlyRootFilesystem: true
              env:
                # Read-only root: HOME (claude's config, chromium's profile) and
                # everything else writable lives on the /tmp emptyDir.
                - name: HOME
                  value: /tmp/home
                - name: CLAUDE_CONFIG_DIR
                  value: /tmp/claude-config
                - name: TZ
                  value: {{ .Values.timeZone }}
                - name: TELEGRAM_API_BASE
                  value: {{ $.Values.telegram.apiBase | quote }}
                - name: CAREER_OPS_DATA_DIR
                  value: /data
                - name: SCAN_ARGS
                  value: {{ join " " $c.scanArgs | quote }}
                - name: FULL_SCAN_ATS
                  value: {{ join "," $c.fullScan.ats | quote }}
                - name: FULL_SCAN_SINCE
                  value: {{ $c.fullScan.sinceDays | quote }}
                - name: MAX_EVALUATIONS
                  value: {{ $c.match.maxPerRun | quote }}
                - name: PARALLEL
                  value: {{ $c.match.parallel | quote }}
                - name: MIN_SCORE
                  value: {{ $c.match.minScore | quote }}
                - name: PREP_MAX
                  value: {{ $c.prepare.maxPerRun | quote }}
                - name: PREP_MIN_SCORE
                  value: {{ $c.prepare.minScore | quote }}
                - name: PREP_MAX_AGE_DAYS
                  value: {{ $c.prepare.maxAgeDays | quote }}
                - name: PREP_TIMEOUT_MINUTES
                  value: {{ $c.prepare.timeoutMinutes | quote }}
                - name: CLAUDE_CODE_VERSION
                  value: {{ $c.claudeCodeVersion | quote }}
                # claude refuses --dangerously-skip-permissions as root unless
                # it is told it is sandboxed; this pod is the sandbox.
                - name: IS_SANDBOX
                  value: "1"
                - name: npm_config_cache
                  value: /tmp/npm
                # Chromium is already in the image.
                - name: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
                  value: "1"
                - name: PLAYWRIGHT_BROWSERS_PATH
                  value: /ms-playwright
                {{- range list "TELEGRAM_BOT_TOKEN" "TELEGRAM_CHAT_ID" "CLAUDE_CODE_OAUTH_TOKEN" }}
                - name: {{ . }}
                  valueFrom:
                    secretKeyRef:
                      name: career-ops
                      key: {{ . }}
                {{- end }}
              resources:
                {{- toYaml $c.resources | nindent 16 }}
              volumeMounts:
                - name: app
                  mountPath: /app
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: cv
                  mountPath: /secrets
                  readOnly: true
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: app
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: config
              configMap:
                name: career-ops-config
            - name: cv
              secret:
                secretName: career-ops
                items:
                  - key: cv.md
                    path: cv.md
            - name: data
              persistentVolumeClaim:
                claimName: career-ops-nas
{{- end }}
