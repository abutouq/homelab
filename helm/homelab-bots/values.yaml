# Image built by gitlab.com/abdulah.abutouq/homelab-bots CI, tagged with the
# commit's short sha. Roll out a new build by bumping the tag.
image:
  repository: registry.gitlab.com/abdulah.abutouq/homelab-bots
  tag: "2fc8e0dd"
  pullPolicy: IfNotPresent

# Schedules below are in this zone (the old host ran on Asia/Amman); pods also
# get TZ so the scripts' dates match.
timeZone: Asia/Amman

# Secrets come from Vault through External Secrets (ClusterSecretStore
# "vault", set up by terraform/k8s-addons). Rotate with `vault kv put`, then
# restart the listener (CronJobs pick it up on their next run).
# Telegram Bot API base for every bot. api.telegram.org is blocked in Jordan,
# so they go through the Cloudflare Worker relay in terraform/telegram-relay.tf.
# Set back to https://api.telegram.org if the block is lifted.
telegram:
  apiBase: https://notify-relay.homebytes.space

externalSecrets:
  storeName: vault
  refreshInterval: 15m
  registry:
    secretName: gitlab-registry-secret
    vaultKey: apps/gitlab-registry

# Storage class for the bots' state volumes; "" = the cluster default (proxmox-lvm).
# Immutable on an existing PVC: changing it means a new PVC name in the templates.
storageClassName: nas-nfs

infraBrief:
  enabled: true
  schedule: "0 8 * * *"
  # Checks the Claude token an hour before the brief, alerts on Telegram if it fails.
  authCheckSchedule: "0 7 * * *"
  # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
  vaultKey: apps/infra-briefs-bot
  # Shares kids-app's long-lived token (`claude setup-token`).
  claudeToken:
    vaultKey: apps/kids-app
    property: CLAUDE_CODE_OAUTH_TOKEN
  # Dedup logs (.seen_headlines.log, .seen_concepts.log) and past briefs.
  storage: 1Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 768Mi}

sreBot:
  # Off for now: only the infra brief runs in the cluster. The sre-bot's
  # templates, Vault entry (secret/apps/sre-bot) and image code stay ready;
  # set true to deploy it (and see listenerReplicas below).
  enabled: false
  # Keep the state volume (and its data migrated from 192.168.0.158) even
  # while the bot itself is off.
  keepState: true
  # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, DEADLINE, DREAM
  vaultKey: apps/sre-bot
  # plan.yaml, quotes.yaml, vocab.yaml and the bot's JSON state. Personal
  # content, so it lives on the volume, not in git.
  storage: 1Gi
  # Telegram allows one long-polling client per bot token: keep this at 0
  # while another listener (e.g. on the old host) is still running.
  listenerReplicas: 0
  # The scheduled messages were disabled on the old host; same here.
  suspended: true
  schedules:
    morning: "0 7 * * *"
    evening: "30 21 * * *"
    preview: "0 22 * * *"
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 256Mi}

# career-ops (https://career-ops.org): daily remote-job scan, CV match with
# Claude, Telegram digest. See templates/career-ops.yaml for the steps.
careerOps:
  enabled: true
  schedule: "0 9 * * *"
  # No release tags on the core repo: pin a main commit and bump it to update.
  repo: https://github.com/career-ops-hq/career-ops.git
  ref: 69a78143fcbc8dfdecf45ee326f42b8a3c00ae55
  gitImage: alpine/git:v2.54.0
  # Matches the playwright version career-ops' own Dockerfile pins.
  image: mcr.microsoft.com/playwright:v1.64.1-jammy
  claudeCodeVersion: "2.1.325"
  # cv_md: the CV as markdown. Personal, so Vault, not this public repo.
  vaultKey: apps/career-ops
  # Its own bot and chat (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID), stored next to cv_md.
  telegram:
    vaultKey: apps/career-ops
  claudeToken:
    vaultKey: apps/kids-app
    property: CLAUDE_CODE_OAUTH_TOKEN
  # Add "--verify" to drop expired postings (launches Chromium per posting).
  scanArgs: []
  # Also sweep every company on these ATSs (scan-ats-full.mjs), not just the
  # tracked ones. workable reads Workable's whole public feed (~5,300 companies,
  # ~1 min). Others: greenhouse, lever, ashby, workday, icims, bamboohr,
  # paylocity, join. [] turns it off.
  # Workable tags most remote roles with one country ("Cyprus · Remote"), so
  # expect country-locked postings that the CV match then scores down.
  fullScan:
    ats: [workable]
    # Postings published in the last N days; runs are daily, overlap is deduped.
    sinceDays: 2
  match:
    # Each evaluation is one `claude -p` session on the subscription; the
    # rest of the queue waits for the next day.
    maxPerRun: 15
    parallel: 2
    # Scores are 1-5; only these reach Telegram. Everything is in reports/.
    minScore: 3.5
    # Match mode scores skills only, so a junior/mid JD scored as high as a
    # senior one. This appends a seniority check to its prompt: below-target
    # roles get at most `cap` (under minScore, so never sent). Remove to turn off.
    seniority:
      # Required experience below this (and no senior/lead wording) = below target.
      minYears: 5
      cap: 2.5
  # Application bundles: for the best recent matches, one more `claude -p`
  # session each tailors the CV (upstream modes/pdf.md, with its fact gate) and
  # writes a cover letter. PDFs land in output/apply/<report>/ on the volume
  # and go to Telegram with notes (gaps, likely knock-out questions). Never
  # submits anything. The ledger output/apply/prepared.tsv stops repeats.
  prepare:
    # Best first; the rest wait for the next run. 0 turns the step off.
    maxPerRun: 5
    # Upstream advises against applying below 4.0 (notify still shows >= 3.5).
    minScore: 4.0
    # Only matches scored this recently, so the old backlog is left alone.
    maxAgeDays: 7
    # Per bundle; a session past this is killed and retried once next run.
    timeoutMinutes: 20
  storage: 2Gi
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 2Gi}

  # Appended to upstream's title_filter.negative (Junior, Intern, ... stay):
  # titles dropped at scan time, before any Claude session is spent.
  extraTitleNegative:
    - word:Jr
    - word:Mid
    - Mid-Level
    - Entry Level
    - Entry-Level
    - Graduate
    - Trainee

  # Appended to upstream's tracked_companies (portals.tracked_companies would
  # replace all ~190 of them). Same name as an upstream entry replaces it.
  extraCompanies:
    # Jordanian job board (JBoard, no API). Read through its sitemap, which
    # robots.txt allows (/rss/ is disallowed); the provider checks robots.txt
    # before each fetch. Job pages' JSON-LD gives the location (Amman), which
    # location_filter lets through via "Jordan". Mostly on-site roles.
    - name: Neptune Careers
      provider: sitemap
      careers_url: https://neptune.careers/jobs/
      enabled: true
      sitemap:
        url: https://neptune.careers/sitemap.xml
        index_filter: jobs
        job_path: '^/jobs/(?<posting_id>\d+)-(?<slug>[^/]+)/?$'
        fetchDetails: true
        detailLimit: 25
    # Remote-job aggregator; publishes everything on its Lever board (~3,000
    # postings, ~46 MB, which the lever provider handles). Most are remote within
    # one country ("US; Remote"), which the "; Remote" block below drops.
    - name: Jobgether
      careers_url: https://jobs.lever.co/jobgether
      enabled: true
    # Workday (auto-detected from the URL). All on-site so far (India, Serbia,
    # Canada, US, EU), so location_filter keeps little; the crawl can hit HTTP 429.
    - name: Synechron
      careers_url: https://synechron.wd1.myworkdayjobs.com/SynechronCareers
      enabled: true

  # Deep-merged over upstream templates/portals.example.yml (its tracked
  # companies, job boards and negative keywords stay); arrays replace.
  portals:
    title_filter:
      positive:
        - DevOps
        - SRE
        - Site Reliability
        - Platform Engineer
        - Platform Engineering
        - Infrastructure Engineer
        - Cloud Engineer
        - Cloud Infrastructure
        - Kubernetes
        - word:Infra
    # Replaces upstream's boards (mostly Polish/Czech/Indonesian, one enabled)
    # with remote-only aggregators. Read whole; title_filter and the location
    # filters below pick the rows.
    job_boards:
      - {name: Remotive, provider: remotive, enabled: true}
      - {name: RemoteOK, provider: remoteok, enabled: true}
      - {name: We Work Remotely, provider: weworkremotely, enabled: true}
      - {name: Himalayas, provider: himalayas, enabled: true}
      - {name: Jobicy, provider: jobicy, enabled: true}
      - {name: Working Nomads, provider: workingnomads, enabled: true}
      - {name: HN Who is Hiring, provider: hackernews, enabled: true}
    # Remote only. Checked against the board's location field, in this order:
    # always_allow wins, then block drops, then allow must match.
    location_filter:
      always_allow:
        - Worldwide
        - Anywhere
        - Global
        - EMEA
        - MENA
        - Middle East
        - Jordan
      block:
        - United States
        - USA
        - Remote - US
        - Remote (US
        - Canada
        - Americas
        - LATAM
        - Mexico
        - Brazil
        - Argentina
        - Remote (EU)
        - UK or EU
        - Remote-Friendly (Travel-Required)
        # "<country or city>; Remote" (Jobgether, Lever, Ashby): remote within that
        # place only. Worldwide/EMEA/Jordan ones still pass via always_allow.
        - "; Remote"
      allow:
        - Remote
        - Anywhere
        - Worldwide
        - Global
        - EMEA
        - MENA
        - Middle East
    # Boards that state a workplace type (Ashby, Lever): remote only; boards
    # that don't still pass and are left to location_filter.
    workplace_filter:
      allow: [remote]
      include_unknown: true
    # "Remote" that is really "remote within the US/EU/UK": read from the job
    # text and checked against profile.location.country.
    country_eligibility_filter:
      exclusionary:
        - must be located in the united states
        - must reside in the united states
        - us-based candidates only
        - remote (us only)
        - authorized to work in the us
        - must be based in the uk
        - right to work in the uk
        - must be based in the eu
        - must reside in the eu
        - eu work permit
        - must be located in canada
      inclusive:
        - worldwide
        - anywhere in the world
        - work from anywhere
        - emea
        - middle east
        - mena
        - jordan

  # config/profile.yml. Only non-identifying fields: name and contacts are in
  # cv.md (Vault). Match mode scores against the CV alone; the scan reads
  # location.country, and full-mode runs read the rest.
  profile:
    candidate:
      years_of_experience: 12
    target_roles:
      primary:
        - Senior DevOps Engineer
        - Senior Site Reliability Engineer
        - Senior Platform Engineer
        - DevOps Team Lead
      archetypes:
        - {name: DevOps / Platform Engineer, level: Senior/Lead, fit: primary}
        - {name: Site Reliability Engineer, level: Senior, fit: primary}
        - {name: Cloud Infrastructure Engineer, level: Senior, fit: secondary}
    compensation:
      location_flexibility: Remote only
    location:
      country: Jordan
      city: Amman
      timezone: Asia/Amman
    language:
      output: en
    spend_tier: standard

# Weekly search for upcoming in-person IT, investment and entrepreneurship
# events in Jordan (Claude with web search only). New events, and reminders
# for known ones starting within remindDays, go to Telegram.
jordanEvents:
  enabled: true
  # Sunday morning, the start of the Jordanian work week.
  schedule: "30 8 * * 0"
  lookaheadDays: 90
  remindDays: 7
  # Already cached on the nodes for career-ops; brings Node 22.
  image: mcr.microsoft.com/playwright:v1.64.1-jammy
  claudeCodeVersion: "2.1.325"
  # Same bot and chat as career-ops (6835986113).
  telegram:
    vaultKey: apps/career-ops
  claudeToken:
    vaultKey: apps/kids-app
    property: CLAUDE_CODE_OAUTH_TOKEN
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 768Mi}
