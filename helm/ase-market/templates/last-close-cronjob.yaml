apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ase-market.fullname" . }}-last-close
  labels:
    {{- include "ase-market.labels" . | nindent 4 }}
    app.kubernetes.io/component: last-close
spec:
  # Once daily, well after the 10:00-13:00 Asia/Amman trading window closes.
  schedule: "0 15 * * 0-4"
  timeZone: "Asia/Amman"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A full run walks ~84 companies sequentially with deliberate pacing
      # (and backs off further if ase.com.jo's public export briefly queues
      # requests under load) - this can take up to ~20 minutes. The deadline
      # exists so a genuinely stuck run can't block every future scheduled
      # run under concurrencyPolicy: Forbid.
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "ase-market.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: last-close
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: last-close
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["php", "/var/www/html/update_last_close_prices.php"]
              {{- if .Values.postgresql.enabled }}
              env:
                - name: DB_HOST
                  value: {{ include "ase-market.fullname" . }}-postgres
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ase-market.fullname" . }}-postgres
                      key: database
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ase-market.fullname" . }}-postgres
                      key: username
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ase-market.fullname" . }}-postgres
                      key: password
              {{- end }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  # PhpSpreadsheet is memory-hungry even with a read filter
                  # limiting parsed rows - 128Mi OOM-killed an earlier attempt.
                  memory: 256Mi
