{{- if .Values.secretsSync.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ase-market.fullname" . }}-secrets-sync
  labels:
    {{- include "ase-market.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ase-market.fullname" . }}-secrets-sync
  labels:
    {{- include "ase-market.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ase-market.fullname" . }}-secrets-sync
  labels:
    {{- include "ase-market.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ase-market.fullname" . }}-secrets-sync
subjects:
  - kind: ServiceAccount
    name: {{ include "ase-market.fullname" . }}-secrets-sync
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ase-market.fullname" . }}-secrets-sync
  labels:
    {{- include "ase-market.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-sync
spec:
  schedule: {{ .Values.secretsSync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "ase-market.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: secrets-sync
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "ase-market.fullname" . }}-secrets-sync
          containers:
            - name: secrets-sync
              image: "{{ .Values.secretsSync.image.repository }}:{{ .Values.secretsSync.image.tag }}"
              imagePullPolicy: IfNotPresent
              env:
                - name: AWS_ACCESS_KEY_ID
                  value: "test"
                - name: AWS_SECRET_ACCESS_KEY
                  value: "test"
                - name: LOCALSTACK_ENDPOINT
                  value: {{ .Values.secretsSync.localstackEndpoint | quote }}
                - name: SECRET_ID
                  value: {{ .Values.secretsSync.secretId | quote }}
                - name: TARGET_SECRET_NAME
                  value: {{ .Values.secretsSync.targetSecretName | default (printf "%s-ase-credentials" (include "ase-market.fullname" .)) | quote }}
                - name: TARGET_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
{{- end }}
