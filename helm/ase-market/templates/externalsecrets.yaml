{{- if .Values.externalSecrets.enabled }}
{{- if .Values.ase.enabled }}
# ASE login (username, password): every key of the Vault entry becomes a key
# of "<fullname>-ase-credentials", the Secret the app already reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ase-market.fullname" . }}-ase-credentials
  labels:
    {{- include "ase-market.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ include "ase-market.fullname" . }}-ase-credentials
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.aseCredentialsKey }}
---
{{- end }}
{{- if .Values.postgresql.enabled }}
# DB credentials read by Postgres (first init only), the API and the CronJobs.
# Only the password lives in Vault; username/database are plain values.
# The password is also stored inside Postgres: after rotating it in Vault, run
# ALTER USER in the database too, then restart the API.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ase-market.fullname" . }}-postgres
  labels:
    {{- include "ase-market.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ include "ase-market.fullname" . }}-postgres
    template:
      data:
        username: {{ .Values.postgresql.username | quote }}
        database: {{ .Values.postgresql.database | quote }}
        password: {{ "{{ .password }}" | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.postgresKey }}
        property: password
---
{{- end }}
# Image pull secret referenced by imagePullSecrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.registrySecretName }}
  labels:
    {{- include "ase-market.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ .Values.externalSecrets.registrySecretName }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ "{{ .dockerconfigjson }}" | quote }}
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.externalSecrets.registrySecretKey }}
        property: dockerconfigjson
{{- end }}
