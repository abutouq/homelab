apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ase-market.fullname" . }}-test-connection"
  labels:
    {{- include "ase-market.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      securityContext:
        readOnlyRootFilesystem: true
      args: ['-q', '-O', '/dev/null', '{{ include "ase-market.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
