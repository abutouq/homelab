{{- if and .Values.postgresql.enabled (not .Values.externalSecrets.enabled) }}
{{- /* Without ESO the password must be supplied at install time (--set
       postgresql.password=...); it is deliberately not kept in values.yaml.
       With ESO, templates/externalsecrets.yaml builds this Secret from Vault. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ase-market.fullname" . }}-postgres
  labels:
    {{- include "ase-market.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgresql.username | quote }}
  password: {{ required "postgresql.password is required when externalSecrets.enabled is false" .Values.postgresql.password | quote }}
  database: {{ .Values.postgresql.database | quote }}
{{- end }}
