{{- if .Values.externalSecrets.enabled }}
# App env secrets (CLAUDE_CODE_OAUTH_TOKEN, ...): every key of the Vault entry
# becomes a key of kids-app-secrets, which the Deployment reads via secretKeyRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kids-app-secrets
  labels:
    {{- include "kids-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: kids-app-secrets
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.appSecretKey }}
---
# Image pull secret referenced by imagePullSecrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-registry-secret
  labels:
    {{- include "kids-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: gitlab-registry-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ "{{ .dockerconfigjson }}" | quote }}
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.externalSecrets.registrySecretKey }}
        property: dockerconfigjson
{{- end }}
