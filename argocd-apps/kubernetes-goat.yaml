# ArgoCD Application: kubernetes-goat
#
# INTENTIONALLY VULNERABLE security-training lab (helm/kubernetes-goat),
# converted from upstream. Runs in its own "kubernetes-goat" namespace
# (upstream uses "default"); secure-middleware and big-monolith are created
# by the chart, and kube-system/superadmin stays in kube-system.
# Auto-synced by the app-of-apps. Delete this file to remove the lab
# (prune cleans up everything it created).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-goat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abutouq/homelab.git
    targetRevision: main
    path: helm/kubernetes-goat
  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-goat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
