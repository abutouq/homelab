# Inventory for standalone hosts running Docker Compose stacks directly —
# NOT part of the Kubernetes cluster (see hosts.ini for that; this repo's
# default inventory in ansible.cfg is hosts.ini, so playbooks against this
# file need -i external-hosts.ini explicitly).
#
# No ansible_become_pass here on purpose, unlike hosts.ini — these
# playbooks prompt for sudo per run (--ask-become-pass) instead of storing
# the password, so this file is safe to commit.

[standalone]
192.168.0.158 ansible_user=ubuntu
