---
# Deploy (or redeploy) a Docker Compose stack from external-services/<service_name>/
# to a standalone host. The compose file in this repo is always the source
# of truth — this playbook copies it to the target and brings the stack up.
#
# Usage:
#   ansible-playbook -i external-hosts.ini deploy_external_service.yml \
#     -e service_name=localstack \
#     --ask-become-pass
#
# remote_dir defaults to /home/ubuntu/<service_name> and normally should NOT
# be overridden — it exists as an escape hatch for services deployed under a
# non-standard path (e.g. monitoring). Letting it default, instead of typing
# it by hand each time, is deliberate: any service with bind-mounted state
# (e.g. LocalStack's ./data, holding every LocalStack Secrets Manager entry)
# resolves that state relative to remote_dir, so a redeploy that lands on a
# different path than last time silently starts from empty state with no
# error — this happened once already and wiped LocalStack's secrets.
#
# First deploy of a brand-new service — create the remote directory first
# (this playbook won't do it for you, to avoid silently deploying to the
# wrong path on a typo):
#   ansible standalone -i external-hosts.ini -m file \
#     -a "path=/home/ubuntu/<service_name> state=directory" -b --ask-become-pass
#
# `become: true` on the copy is what lets this write into root-owned
# directories (e.g. /data/monitoring) directly — no more manual
# scp-to-/tmp-then-sudo-cp two-step.

- name: Deploy external Docker Compose service
  hosts: standalone
  gather_facts: false
  remote_user: ubuntu
  become: true

  vars:
    compose_src: "{{ playbook_dir }}/../external-services/{{ service_name | default('') }}/docker-compose.yml"
    remote_dir: "/home/ubuntu/{{ service_name | default('') }}"

  tasks:
    - name: Verify required vars are set
      ansible.builtin.assert:
        that:
          - service_name is defined
        fail_msg: "Pass -e service_name=<name> (must match a directory under external-services/). remote_dir defaults to /home/ubuntu/<service_name> - only pass -e remote_dir=<path> to override for a service that already lives somewhere else."

    - name: Show resolved target directory
      ansible.builtin.debug:
        msg: "Deploying {{ service_name }} to {{ remote_dir }} on {{ inventory_hostname }}"

    - name: Check whether remote_dir already exists
      ansible.builtin.stat:
        path: "{{ remote_dir }}"
      register: remote_dir_stat

    - name: Fail if remote_dir doesn't exist yet
      ansible.builtin.assert:
        that:
          - remote_dir_stat.stat.exists
        fail_msg: >-
          {{ remote_dir }} doesn't exist on {{ inventory_hostname }}. If this
          is really the first deploy of {{ service_name }}, create it first
          (see the playbook header). If {{ service_name }} was already
          deployed under a different path, that's the bug this check is
          for - re-run with -e remote_dir=<its real path> instead of
          silently starting it fresh here.

    - name: Copy docker-compose.yml to the target host
      ansible.builtin.copy:
        src: "{{ compose_src }}"
        dest: "{{ remote_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Deploy stack (docker compose up -d)
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ remote_dir }}"
      register: compose_up
      changed_when: >-
        'Started' in (compose_up.stdout + compose_up.stderr)
        or 'Recreated' in (compose_up.stdout + compose_up.stderr)
        or 'Created' in (compose_up.stdout + compose_up.stderr)

    - name: Show deploy output
      ansible.builtin.debug:
        msg: "{{ (compose_up.stderr_lines | default([])) + (compose_up.stdout_lines | default([])) }}"
