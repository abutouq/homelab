---
# HashiCorp Vault install (native apt package + systemd), UI enabled.
#
# Usage:
#   ansible-playbook -i external-hosts.ini ansible/install_vault.yml --ask-become-pass
#
# What this playbook does:
#   1. Adds HashiCorp's apt repo/GPG key (idempotent — matches what's
#      already configured on 192.168.0.158, where Vault was originally
#      installed manually, out-of-band)
#   2. Installs the 'vault' package
#   3. Deploys /etc/vault.d/vault.hcl from templates/vault.hcl.j2 — raft
#      storage, UI enabled, listener bound to 127.0.0.1:8200 only (not the
#      LAN interface; access goes through Teleport's app_service instead,
#      see ansible/teleport_apps.yml, same pattern as every other internal
#      tool on this host)
#   4. Ensures the vault.service is enabled and running, restarting it if
#      the config changed
#
# NOT done by this playbook, deliberately: `vault operator init`. That's a
# one-time, highly sensitive manual step — it generates the unseal keys and
# root token, which must go straight to a password manager or similar, never
# into this repo or an Ansible variable. Run it yourself once, on the host:
#   vault operator init
# and unseal after every restart with:
#   vault operator unseal   (x3, using 3 of the 5 unseal keys)
#
# Safe to re-run: apt install/template/systemd tasks are all idempotent.
# Restarting Vault after a config change does not lose data (raft storage
# persists to disk) — it just comes back up sealed until unsealed again.

- name: Install and configure HashiCorp Vault
  hosts: standalone
  become: true
  tasks:
    - name: Download HashiCorp GPG key
      ansible.builtin.get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /tmp/hashicorp.asc
        mode: '0644'

    - name: Dearmor HashiCorp GPG key into apt keyring
      ansible.builtin.command: >
        gpg --batch --yes --dearmor
        -o /usr/share/keyrings/hashicorp-archive-keyring.gpg /tmp/hashicorp.asc
      args:
        creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

    - name: Add HashiCorp apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/hashicorp.list
        content: "deb [arch=amd64 signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com noble main\n"
        mode: '0644'
      register: hashicorp_repo

    - name: Update apt cache after adding the repo
      ansible.builtin.apt:
        update_cache: true
      when: hashicorp_repo.changed

    - name: Install vault
      ansible.builtin.apt:
        name: vault
        state: present

    - name: Ensure Vault's raft storage directory exists
      ansible.builtin.file:
        path: /opt/vault/data
        state: directory
        owner: vault
        group: vault
        mode: '0750'

    - name: Deploy Vault configuration (UI enabled)
      ansible.builtin.template:
        src: templates/vault.hcl.j2
        dest: /etc/vault.d/vault.hcl
        owner: vault
        group: vault
        mode: '0640'
      notify: Restart vault

    - name: Ensure Vault service is enabled and running
      ansible.builtin.systemd:
        name: vault
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart vault
      ansible.builtin.systemd:
        name: vault
        state: restarted
