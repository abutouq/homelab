# ArgoCD Application: argocd-image-updater-secret-sync
#
# Applies argocd-image-updater/secret-sync/ - a CronJob that keeps the
# argocd-image-updater-secret and ssh-git-creds Secrets (consumed by
# argocd/argocd-image-updater.yaml) synced from LocalStack Secrets Manager,
# same pattern as helm/kids-app's registry-secret-sync / oauth-token-sync.
#
# See argocd-image-updater/secret-sync/cronjob.yaml for the one-time secret
# bootstrap this needs before its first run.
#
# Apply this Application once:
#   kubectl apply -f argocd/argocd-image-updater-secret-sync.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater-secret-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abutouq/homelab.git
    targetRevision: main
    path: argocd-image-updater/secret-sync
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
