# ArgoCD Application: kids-app
#
# Deploys the kids-app Helm chart (helm/kids-app) to the kids-app namespace.
#
# Apply this Application once:
#   kubectl apply -f argocd/kids-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kids-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abutouq/homelab.git
    targetRevision: main
    path: helm/kids-app
  destination:
    server: https://kubernetes.default.svc
    namespace: kids-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
