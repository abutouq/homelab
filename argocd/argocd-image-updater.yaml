# ArgoCD Application: argocd-image-updater
#
# Deploys argocd-image-updater (upstream Helm chart) into the argocd namespace.
# This is the controller that reads the argocd-image-updater.argocd.argoproj.io/*
# annotations on other Applications (e.g. kids-app) and pushes new image tags.
#
# Needs two credentials in the argocd namespace, kept in sync from LocalStack
# Secrets Manager by ../../argocd-image-updater/secret-sync (see
# argocd/argocd-image-updater-secret-sync.yaml):
#   argocd-image-updater-secret  key argocd.token  - ArgoCD API token, read
#                                                     by this Application's
#                                                     extraEnv below
#   homelab-repo-creds           ArgoCD repository credential (GitHub PAT) -
#                                 used by ArgoCD's repo-server for the git
#                                 write-back push, not referenced here
#
# Bootstrapped end-to-end (including both LocalStack Secrets Manager
# entries) by ansible/install_argocd_image_updater.yml.
#
# Apply this Application once:
#   kubectl apply -f argocd/argocd-image-updater.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.2.4
    helm:
      values: |
        config:
          argocd:
            grpcWeb: true
            serverAddress: argocd-server.argocd.svc.cluster.local:80
            insecure: true
        extraEnv:
          - name: ARGOCD_TOKEN
            valueFrom:
              secretKeyRef:
                name: argocd-image-updater-secret
                key: argocd.token
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
