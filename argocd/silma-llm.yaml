# ArgoCD Application: silma-llm
#
# Deploys the silma-llm Helm chart (helm/silma-llm) to the silma-llm namespace.
# Runs Ollama serving a quantized GGUF build of silma-ai/SILMA-9B-Instruct-v1.0
# on CPU (no GPU nodes in this cluster).
#
# Apply this Application once:
#   kubectl apply -f argocd/silma-llm.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: silma-llm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abutouq/homelab.git
    targetRevision: main
    path: helm/silma-llm
  destination:
    server: https://kubernetes.default.svc
    namespace: silma-llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
